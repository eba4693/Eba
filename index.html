<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Speed HUD</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg: #020304;
    --cyan: #2FE8FF;
    --cyan-dim: rgba(47,232,255,0.14);
    --amber: #FFB020;
    --red: #FF4444;
    --ink: #C7D3D8;
    --ink-dim: #55666B;
    --line: rgba(199,211,216,0.10);
  }

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height:100%;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
    user-select: none;
  }

  #app {
    height: 100vh;
    height: 100dvh;
    width: 100vw;
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    transition: transform 0.3s ease;
  }

  #app.mirrored { transform: scaleX(-1); }

  /* ---- Top bar ---- */
  #topbar {
    display:flex;
    justify-content: space-between;
    align-items:center;
    padding: 14px 18px 0 18px;
    flex-shrink:0;
  }

  .status-pill {
    display:flex;
    align-items:center;
    gap:6px;
    font-size: 11px;
    letter-spacing: 0.04em;
    color: var(--ink-dim);
  }
  .dot {
    width:7px; height:7px; border-radius:50%;
    background: var(--ink-dim);
    transition: background 0.3s;
  }
  .dot.live { background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }
  .dot.warn { background: var(--red); box-shadow: 0 0 8px var(--red); }

  .icon-btn {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--ink);
    width: 38px; height:38px;
    border-radius: 10px;
    display:flex; align-items:center; justify-content:center;
    font-size: 16px;
  }
  .icon-btn:active { background: var(--cyan-dim); }
  .icon-btn.active { color: var(--cyan); border-color: var(--cyan); }

  #topbar .right { display:flex; gap:8px; }

  /* ---- Main speed readout ---- */
  #main {
    flex: 1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    position:relative;
    min-height:0;
  }

  #speed-value {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: 30vw;
    line-height: 0.85;
    color: var(--cyan);
    letter-spacing: -0.02em;
    text-shadow: 0 0 30px rgba(47,232,255,0.35);
    font-variant-numeric: tabular-nums;
  }

  #speed-unit {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: 0.15em;
    color: var(--ink-dim);
    margin-top: -6px;
  }

  #accuracy-note {
    position:absolute;
    bottom: -6px;
    font-size: 11px;
    color: var(--ink-dim);
    text-align:center;
    padding: 0 20px;
  }

  /* ---- Stat row ---- */
  #stats {
    flex-shrink:0;
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    background: var(--line);
    border-top: 1px solid var(--line);
  }

  .stat {
    background: var(--bg);
    padding: 12px 8px 16px 8px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap: 4px;
  }

  .stat .label {
    font-size: 10.5px;
    color: var(--ink-dim);
    font-weight: 500;
    letter-spacing: 0.03em;
  }

  .stat .value {
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    font-size: 22px;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }

  .stat .value.pending { color: var(--amber); }
  .stat .value small { font-size: 12px; font-weight: 500; color: var(--ink-dim); margin-left: 2px;}

  #reset-row {
    flex-shrink:0;
    display:flex;
    justify-content:center;
    padding: 10px 0 14px 0;
  }

  #reset-btn {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--ink-dim);
    font-family:'Inter';
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.05em;
    padding: 8px 22px;
    border-radius: 20px;
  }
  #reset-btn:active { border-color: var(--red); color: var(--red); }

  /* ---- Permission overlay ---- */
  #overlay {
    position:fixed; inset:0;
    background: var(--bg);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding: 40px;
    text-align:center;
    z-index: 10;
  }
  #overlay h1 {
    font-family:'Orbitron';
    color: var(--cyan);
    font-size: 20px;
    margin-bottom: 14px;
    letter-spacing: 0.04em;
  }
  #overlay p {
    color: var(--ink-dim);
    font-size: 14px;
    line-height: 1.6;
    max-width: 320px;
    margin-bottom: 26px;
  }
  #overlay button {
    background: var(--cyan);
    color: #001114;
    border: none;
    font-family:'Inter';
    font-weight: 700;
    font-size: 14px;
    padding: 14px 30px;
    border-radius: 12px;
    letter-spacing: 0.02em;
  }
  #overlay button:active { opacity: 0.8; }
  #overlay.hidden { display:none; }
  #overlay .err { color: var(--red); font-size: 13px; margin-top: 16px; max-width: 300px; }
</style>
</head>
<body>

<div id="overlay">
  <h1>SPEED HUD</h1>
  <p>Foloseste GPS-ul telefonului pentru viteza in timp real, accelerație 0–60 / 0–100 și viteza medie. Monteaza telefonul pe parbriz — nu il atinge in timpul mersului.</p>
  <button id="start-btn">Pornește</button>
  <div class="err" id="err-msg"></div>
</div>

<div id="app">
  <div id="topbar">
    <div class="status-pill">
      <div class="dot" id="gps-dot"></div>
      <span id="gps-text">GPS...</span>
    </div>
    <div class="right">
      <button class="icon-btn" id="unit-btn">KM/H</button>
      <button class="icon-btn" id="mirror-btn">⇄</button>
      <button class="icon-btn" id="wake-btn">☀</button>
    </div>
  </div>

  <div id="main">
    <div id="speed-value">0</div>
    <div id="speed-unit">KM/H</div>
    <div id="accuracy-note" id="accuracy-note"></div>
  </div>

  <div id="stats">
    <div class="stat">
      <div class="label">0–100 KM/H</div>
      <div class="value" id="stat-0100">—</div>
    </div>
    <div class="stat">
      <div class="label">VITEZA MEDIE</div>
      <div class="value" id="stat-avg">0</div>
    </div>
    <div class="stat">
      <div class="label">VITEZA MAX</div>
      <div class="value" id="stat-max">0</div>
    </div>
  </div>

  <div id="reset-row">
    <button id="reset-btn">RESETEAZĂ SESIUNEA</button>
  </div>
</div>

<script>
(function(){
  const app = document.getElementById('app');
  const overlay = document.getElementById('overlay');
  const startBtn = document.getElementById('start-btn');
  const errMsg = document.getElementById('err-msg');

  const speedValueEl = document.getElementById('speed-value');
  const speedUnitEl = document.getElementById('speed-unit');
  const accuracyNoteEl = document.getElementById('accuracy-note');
  const gpsDot = document.getElementById('gps-dot');
  const gpsText = document.getElementById('gps-text');
  const unitBtn = document.getElementById('unit-btn');
  const mirrorBtn = document.getElementById('mirror-btn');
  const wakeBtn = document.getElementById('wake-btn');
  const resetBtn = document.getElementById('reset-btn');

  const stat0100 = document.getElementById('stat-0100');
  const statAvg = document.getElementById('stat-avg');
  const statMax = document.getElementById('stat-max');

  let useMph = false;          // false = km/h, true = mph
  let mirrored = false;
  let wakeLock = null;
  let watchId = null;

  // session tracking
  let totalDistanceM = 0;      // meters, while moving
  let movingTimeS = 0;         // seconds while speed > threshold
  let lastFixTime = null;
  let lastLat = null, lastLon = null;
  let maxSpeedKmh = 0;

  // 0-100 km/h run tracking
  const RUN_TARGET_KMH = 100;
  const RUN_START_THRESHOLD_KMH = 2; // considered "stopped/starting"
  let runActive = false;
  let runStartTime = null;
  let bestRunSeconds = null;

  const MOVING_THRESHOLD_KMH = 1.5;

  function kmhToMph(k){ return k * 0.621371; }

  function haversineMeters(lat1, lon1, lat2, lon2){
    const R = 6371000;
    const toRad = d => d * Math.PI / 180;
    const dLat = toRad(lat2-lat1);
    const dLon = toRad(lon2-lon1);
    const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
    const c = 2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    return R*c;
  }

  function setGpsStatus(state, text){
    gpsDot.className = 'dot' + (state === 'live' ? ' live' : state === 'warn' ? ' warn' : '');
    gpsText.textContent = text;
  }

  function formatSpeedDisplay(kmh){
    const val = useMph ? kmhToMph(kmh) : kmh;
    return Math.round(val);
  }

  function updateDisplay(kmh, accuracyM){
    speedValueEl.textContent = formatSpeedDisplay(kmh);
    speedUnitEl.textContent = useMph ? 'MPH' : 'KM/H';

    if (accuracyM != null){
      if (accuracyM > 30){
        accuracyNoteEl.textContent = 'Semnal GPS slab (±' + Math.round(accuracyM) + 'm)';
      } else {
        accuracyNoteEl.textContent = '';
      }
    }
  }

  function updateStats(){
    const avgKmh = movingTimeS > 0 ? (totalDistanceM / movingTimeS) * 3.6 : 0;
    statAvg.textContent = Math.round(useMph ? kmhToMph(avgKmh) : avgKmh);
    statMax.textContent = Math.round(useMph ? kmhToMph(maxSpeedKmh) : maxSpeedKmh);

    if (bestRunSeconds != null){
      stat0100.textContent = bestRunSeconds.toFixed(1) + 's';
      stat0100.classList.remove('pending');
    } else if (runActive){
      const elapsed = (performance.now() - runStartTime) / 1000;
      stat0100.textContent = elapsed.toFixed(1) + 's';
      stat0100.classList.add('pending');
    } else {
      stat0100.textContent = '—';
      stat0100.classList.remove('pending');
    }
  }

  function handleRunTracking(kmh){
    if (!runActive && kmh <= RUN_START_THRESHOLD_KMH){
      runActive = true;
      runStartTime = performance.now();
    } else if (runActive){
      if (kmh >= RUN_TARGET_KMH){
        const elapsed = (performance.now() - runStartTime) / 1000;
        if (bestRunSeconds === null || elapsed < bestRunSeconds){
          bestRunSeconds = elapsed;
        }
        runActive = false;
      } else if (kmh <= RUN_START_THRESHOLD_KMH){
        // still stationary, keep waiting / restart timer
        runStartTime = performance.now();
      }
    }
  }

  function onPosition(pos){
    const c = pos.coords;
    const now = pos.timestamp;

    let speedMs = c.speed; // meters/second, may be null
    let kmh;

    if (speedMs != null && !isNaN(speedMs) && speedMs >= 0){
      kmh = speedMs * 3.6;
    } else if (lastLat != null && lastFixTime != null){
      const dt = (now - lastFixTime) / 1000;
      if (dt > 0){
        const dist = haversineMeters(lastLat, lastLon, c.latitude, c.longitude);
        kmh = (dist / dt) * 3.6;
      } else {
        kmh = 0;
      }
    } else {
      kmh = 0;
    }

    if (kmh < 0 || isNaN(kmh)) kmh = 0;
    if (kmh > 400) kmh = 0; // reject GPS glitches

    // accumulate distance/time for average, only while moving
    if (lastFixTime != null){
      const dt = (now - lastFixTime) / 1000;
      if (dt > 0 && dt < 10 && kmh > MOVING_THRESHOLD_KMH){
        movingTimeS += dt;
        totalDistanceM += (kmh / 3.6) * dt;
      }
    }

    if (kmh > maxSpeedKmh) maxSpeedKmh = kmh;

    handleRunTracking(kmh);
    updateDisplay(kmh, c.accuracy);
    updateStats();

    lastLat = c.latitude;
    lastLon = c.longitude;
    lastFixTime = now;

    setGpsStatus('live', 'GPS activ');
  }

  function onPositionError(err){
    setGpsStatus('warn', 'Fără semnal GPS');
    if (err.code === err.PERMISSION_DENIED){
      overlay.classList.remove('hidden');
      errMsg.textContent = 'Acces GPS refuzat. Activează locația pentru acest site din setările browserului.';
    }
  }

  function startTracking(){
    if (!('geolocation' in navigator)){
      errMsg.textContent = 'Acest dispozitiv nu suportă geolocalizare.';
      return;
    }
    watchId = navigator.geolocation.watchPosition(onPosition, onPositionError, {
      enableHighAccuracy: true,
      maximumAge: 0,
      timeout: 5000
    });
    overlay.classList.add('hidden');
    requestWakeLock();
  }

  async function requestWakeLock(){
    try {
      if ('wakeLock' in navigator){
        wakeLock = await navigator.wakeLock.request('screen');
        wakeBtn.classList.add('active');
      }
    } catch(e){
      wakeBtn.classList.remove('active');
    }
  }

  document.addEventListener('visibilitychange', async () => {
    if (wakeLock !== null && document.visibilityState === 'visible'){
      await requestWakeLock();
    }
  });

  startBtn.addEventListener('click', startTracking);

  unitBtn.addEventListener('click', () => {
    useMph = !useMph;
    unitBtn.textContent = useMph ? 'MPH' : 'KM/H';
    updateStats();
  });

  mirrorBtn.addEventListener('click', () => {
    mirrored = !mirrored;
    app.classList.toggle('mirrored', mirrored);
    mirrorBtn.classList.toggle('active', mirrored);
  });

  wakeBtn.addEventListener('click', () => {
    if (wakeLock){
      wakeLock.release();
      wakeLock = null;
      wakeBtn.classList.remove('active');
    } else {
      requestWakeLock();
    }
  });

  resetBtn.addEventListener('click', () => {
    totalDistanceM = 0;
    movingTimeS = 0;
    maxSpeedKmh = 0;
    bestRunSeconds = null;
    runActive = false;
    lastLat = null; lastLon = null; lastFixTime = null;
    updateStats();
  });

  // keep stat labels correct on load
  document.querySelector('#stats .stat:nth-child(1) .label').textContent =
    'ACCELERAȚIE (100)';
})();
</script>

</body>
</html>
